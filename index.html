<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta id="status-bar-style" name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ProjectLog">
  <meta name="description" content="Lokale Projektzentrale für Projekte, Bugs, Ideen, Referenzen und rohe Eingangsmaterialien.">
  <link rel="manifest" href="./manifest.webmanifest?v=4.2.0">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=4.2.0">
  <link rel="stylesheet" href="./src/design/tokens.css?v=4.2.0">
  <link rel="stylesheet" href="./src/design/components.css?v=4.2.0">
  <link rel="stylesheet" href="./src/design/accessibility.css?v=4.2.0">
  <title>ProjectLog</title>
</head>
<body>
  <a class="skip-link" href="#app-main">Zum Inhalt springen</a>
  <div id="connection-status" class="connection-status" role="status" aria-live="polite" aria-atomic="true" hidden></div>
  <div id="app-shell" class="app-shell">
    <header id="app-header" class="app-header" aria-label="Seitennavigation"></header>
    <main id="app-main" class="app-main" tabindex="-1">
      <section class="loading-state" aria-label="App wird geladen"><div class="spinner" aria-hidden="true"></div><p>Daten werden geladen …</p></section>
    </main>
    <nav id="tab-bar" class="tab-bar" aria-label="Hauptnavigation">
      <button type="button" class="tab-item is-active" data-nav="projects" aria-current="page"><span class="tab-icon" aria-hidden="true"></span><span>Projekte</span></button>
      <button type="button" class="tab-item" data-nav="inbox"><span class="tab-icon" aria-hidden="true"></span><span>Eingang</span></button>
    </nav>
  </div>

  <dialog id="editor-dialog" class="sheet-dialog" aria-labelledby="editor-title">
    <form id="editor-form" method="dialog" novalidate>
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <button type="button" class="text-button" data-editor-action="cancel">Abbrechen</button>
        <h2 id="editor-title">Eintrag</h2>
        <button type="submit" class="text-button strong">Sichern</button>
      </header>
      <div class="sheet-body">
        <div id="editor-fields" class="sheet-content"></div>
        <div id="editor-error" class="form-error" role="alert" hidden></div>
        <div id="editor-delete-slot" class="sheet-danger"></div>
      </div>
    </form>
  </dialog>

  <dialog id="action-dialog" class="action-dialog" aria-labelledby="action-sheet-title">
    <div id="action-sheet-content"></div>
  </dialog>

  <input id="image-file" type="file" accept="image/*" multiple hidden>
  <input id="attachment-file" type="file" accept="application/pdf,text/plain,text/markdown,application/json,.pdf,.txt,.md,.json" multiple hidden>
  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="./src/app.js?v=4.2.0"></script>
</body>
</html>
